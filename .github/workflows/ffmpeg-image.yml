name: ffmpeg-image

on:
  push:
    tags:
      - "ffmpeg-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag, e.g. 9.0.2-1"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/goshl-ffmpeg

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#ffmpeg-}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing tag
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "$IMAGE:${{ steps.version.outputs.version }} already exists; tags are immutable" >&2
            exit 1
          fi

  build:
    needs: meta
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/ffmpeg
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}

  publish:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create -t "$IMAGE:${{ needs.meta.outputs.version }}" \
            "$IMAGE@$(cat digests/amd64)" "$IMAGE@$(cat digests/arm64)"
          docker buildx imagetools inspect "$IMAGE:${{ needs.meta.outputs.version }}"
